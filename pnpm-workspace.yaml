allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/openai@2.0.138'

# Same-major patch: Next pins postcss@8.4.31 (high/moderate advisories fixed in >=8.5.23).
overrides:
  postcss@<8.5.23: 8.5.29
  # provider-utils still declares undici ^5.29.0; the TLS/WebSocket fixes are in 6.29.1.
  # This is the only override for that tree.
  undici@<6.29.1: 6.29.1
